name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# 最小権限：このワークフローはリポジトリを読むだけ
permissions:
  contents: read

jobs:
  # ---------- Linux：ビルド・テスト・静的解析（gcc と clang の両方） ----------
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Build (warnings as errors)
        run: make CC=${{ matrix.cc }} WERROR=1

      - name: Unit tests (ASan + UBSan)
        run: make test CC=${{ matrix.cc }}

      - name: Static analysis (cppcheck)
        if: matrix.cc == 'gcc'
        run: make lint

  # ---------- Linux：ファジング（60秒） ----------
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fuzzer runtime
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev

      - name: Fuzz save loader
        run: make fuzz FUZZ_TIME=60

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*

  # ---------- Windows：ビルドして実行ファイルを保存 ----------
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Build (warnings as errors)
        run: make WERROR=1

      - uses: actions/upload-artifact@v4
        with:
          name: rpg-windows
          path: rpg.exe
